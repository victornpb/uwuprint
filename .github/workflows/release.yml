name: Build release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac
            os: macos-14
          - target: win
            os: windows-2022
          - target: linux
            os: ubuntu-22.04

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build the app
        run: npm run test

      - name: Package ${{ matrix.target }} binaries
        run: npm run make:${{ matrix.target }}

      - name: Store release binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish binaries to release
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Attach binaries to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          find release-assets -type f -print0 \
            | xargs -0 -n 1 gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber
